
    <!DOCTYPE html>
    <html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>الرسم البياني للأسعار | Sundair برلين ⇄ دمشق</title>
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
        <style>
            * { box-sizing: border-box; }
            body {
                font-family: 'Segoe UI', Tahoma, sans-serif;
                background: linear-gradient(180deg, #f4f6f9 0%, #e9edf2 100%);
                margin: 0;
                padding: 24px 12px;
                color: #1a1a2e;
            }
            .page {
                max-width: 950px;
                margin: 0 auto;
            }
            .page-header {
                text-align: center;
                margin-bottom: 20px;
            }
            .page-header h1 {
                font-size: 22px;
                color: #0b3d91;
                margin: 0 0 4px;
            }
            .back-btn {
                display: inline-block;
                margin-bottom: 16px;
                color: #0b3d91;
                text-decoration: none;
                font-weight: 600;
                font-size: 14px;
            }
            .chart-card {
                background: #fff;
                border-radius: 14px;
                box-shadow: 0 3px 12px rgba(0,0,0,0.07);
                padding: 18px;
                margin-bottom: 20px;
                position: relative;
            }
            .chart-card h2 {
                font-size: 16px;
                color: #333;
                margin-top: 0;
                display: inline-block;
            }
            .zoom-btn {
                float: left;
                background: #f0f4fa;
                border: none;
                border-radius: 8px;
                padding: 6px 14px;
                font-size: 13px;
                font-weight: 600;
                color: #0b3d91;
                cursor: pointer;
            }
            .zoom-btn:hover { background: #e2eafc; }
            .chart-wrap {
                position: relative;
                height: 480px;
            }
            .chart-card:fullscreen {
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 30px;
                background: #fff;
            }
            .chart-card:fullscreen .chart-wrap {
                height: 85vh;
            }
            .note {
                font-size: 12px;
                color: #999;
                text-align: center;
                margin-top: 10px;
            }
        </style>
    </head>
    <body>
        <div class="page">
            <a class="back-btn" href="index.html">→ رجوع للجدول</a>
            <div class="page-header">
                <h1>📈 الرسم البياني للأسعار</h1>
                <div>برلين براندنبورج (BER) ⇄ دمشق (DAM)</div>
            </div>

            <div class="chart-card" id="outboundCard">
                <button class="zoom-btn" onclick="toggleFullscreen('outboundCard')">⛶ تكبير</button>
                <h2>🛫 أسعار رحلات الذهاب (برلين ← دمشق)</h2>
                <div class="chart-wrap"><canvas id="outboundChart"></canvas></div>
            </div>

            <div class="chart-card" id="inboundCard">
                <button class="zoom-btn" onclick="toggleFullscreen('inboundCard')">⛶ تكبير</button>
                <h2>🛬 أسعار رحلات العودة (دمشق ← برلين)</h2>
                <div class="chart-wrap"><canvas id="inboundChart"></canvas></div>
            </div>

            <div class="note">الفجوات في الخط تعني إن الرحلة غير متوفرة في هذا التاريخ — اضغط "تكبير" لعرض أوضح بملء الشاشة</div>
        </div>

        <script>
            function toggleFullscreen(cardId) {
                const el = document.getElementById(cardId);
                if (!document.fullscreenElement) {
                    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
                } else {
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                }
            }

            const charts = {};
            document.addEventListener('fullscreenchange', () => {
                Object.values(charts).forEach(c => c.resize());
            });

            fetch('data.json')
                .then(res => res.json())
                .then(data => {
                    function makeChart(canvasId, series, label, color) {
                        const labels = series.map(item => item.date_display);
                        const prices = series.map(item => item.price);

                        charts[canvasId] = new Chart(document.getElementById(canvasId), {
                            type: 'line',
                            data: {
                                labels: labels,
                                datasets: [{
                                    label: label,
                                    data: prices,
                                    borderColor: color,
                                    backgroundColor: color + '33',
                                    tension: 0.25,
                                    spanGaps: false,
                                    pointRadius: 4,
                                    borderWidth: 3,
                                    fill: true,
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: {
                                    legend: { display: false },
                                    tooltip: {
                                        callbacks: {
                                            label: function(ctx) {
                                                const item = series[ctx.dataIndex];
                                                if (item.price === null) return 'غير متوفر';
                                                return item.price.toFixed(2) + ' € — رحلة ' + (item.flight_no || '-');
                                            }
                                        }
                                    }
                                },
                                scales: {
                                    y: {
                                        title: { display: true, text: 'السعر (€)' },
                                        beginAtZero: false,
                                    },
                                    x: {
                                        ticks: { maxRotation: 60, minRotation: 45 }
                                    }
                                }
                            }
                        });
                    }

                    makeChart('outboundChart', data.outbound, 'ذهاب', '#0b3d91');
                    makeChart('inboundChart', data.inbound, 'عودة', '#28a745');
                })
                .catch(err => {
                    document.querySelector('.page').innerHTML +=
                        '<p style="color:red; text-align:center;">تعذر تحميل بيانات الرسم البياني.</p>';
                    console.error(err);
                });
        </script>
    </body>
    </html>
